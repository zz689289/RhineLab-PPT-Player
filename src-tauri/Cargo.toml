[package]
name = "archive-player"
version = "0.1.0"
description = "Local document archive player"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
rfd = { version = "=0.15.4", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

